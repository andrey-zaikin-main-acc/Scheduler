<!doctype html><html><head><meta charset="utf-8"><style>
:root{--text:#31333f;--background:#fff;--secondary-background:#f0f2f6;--primary:#ff4b4b;--font:sans-serif}
*{box-sizing:border-box}body{margin:0;font:14px var(--font),sans-serif;color:var(--text);background:var(--background)}
.viewport{max-height:420px;overflow:auto;border:1px solid color-mix(in srgb,var(--text) 22%,var(--background));border-radius:4px;background:var(--background)}
table{border-collapse:separate;border-spacing:0;min-width:1900px;width:100%;background:var(--background)}
th,td{border-right:1px solid color-mix(in srgb,var(--text) 14%,var(--background));border-bottom:1px solid color-mix(in srgb,var(--text) 14%,var(--background));padding:5px 7px;white-space:nowrap;height:35px;background:var(--background)}
th{position:sticky;top:0;background:var(--secondary-background);z-index:2;font-weight:600;text-align:left;color:var(--text)}
input,select{font:inherit;color:inherit;border:0;background:var(--background);width:100%;min-width:80px;padding:4px;color-scheme:light dark}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:0}
input[type=checkbox]{min-width:18px;width:18px;accent-color:var(--primary)}
.readonly{background:color-mix(in srgb,var(--secondary-background) 45%,var(--background));color:color-mix(in srgb,var(--text) 72%,var(--background))}
.readonly-display{display:block;padding:4px;min-height:26px}.readonly input[type=checkbox]{background:transparent;opacity:1;cursor:default}.date{min-width:130px}
th.col-editable{border-left:3px solid var(--primary)}td.col-editable{border-left:3px solid color-mix(in srgb,var(--primary) 45%,var(--background))}
th.col-locked{color:color-mix(in srgb,var(--text) 62%,var(--background));font-style:italic}
</style></head><body><div id="grid"></div><script src="model.js"></script><script src="view.js"></script><script>
const M=OrdersGridModel,V=OrdersGridView;let state=null,args=null,currentViewport=null,displaySignature=null;
let heightFrame=null,lastFrameHeight=null;
let heightObserver=null;
function booleanFields(){return new Set(args.boolean_fields||Array.from(V.BOOLEAN_FIELDS))}
function numericFields(){return new Set(args.numeric_fields||Array.from(V.NUMERIC_FIELDS))}
function post(type,data){parent.postMessage(Object.assign({isStreamlitMessage:true,type},data||{}),"*")}
function value(flush){post("streamlit:setComponentValue",{value:M.payload(state,flush),dataType:"json"})}
function parse(el,field){if(el.type==="checkbox")return el.checked;if(el.type==="number")return el.value===""?null:Number(el.value);return el.value===""?null:el.value}
function flushValue(token){if(!state.active)return M.payload(state,token);const el=document.querySelector(`[data-key="${state.active.key}"][data-field="${CSS.escape(state.active.field)}"]`);if(!el)return M.payload(state,token);const field=state.active.field;return M.flushActive(state,state.active.key,field,parse(el,field),field==="Выбран"?"selection":el.type==="checkbox"?"checkbox":"cell",token)}
function makeEditor(row,field,key){let el;
  const options=(args.options||{})[field];
  if(booleanFields().has(field)){el=document.createElement("input");el.type="checkbox";el.checked=!!row[field]}
  else if(options){el=document.createElement("select");for(const option of options){const o=document.createElement("option");o.value=option;o.textContent=option||"—";el.appendChild(o)}el.value=row[field]??""}
  else{el=document.createElement("input");el.type=V.DATE_FIELDS.has(field)?"date":numericFields().has(field)?"number":"text";if(V.DATE_FIELDS.has(field))el.className="date";el.value=row[field]??""}
  el.dataset.key=key;el.dataset.field=field;
  el.addEventListener("focus",()=>{state.active={key,field};state.draftValue=el.value});
  el.addEventListener("input",()=>{state.draftValue=el.value});
  el.addEventListener("change",()=>{const after=parse(el,field);M.edit(state,key,field,after,field==="Выбран"?"selection":el.type==="checkbox"?"checkbox":"cell",!!args.single_selection);state.draftValue=null;if(field==="Выбран"&&args.single_selection)syncSelectionCheckboxes();value(null)});
  return el}
function makeRenderer(row,field){
  if(booleanFields().has(field)){const el=document.createElement("input");el.type="checkbox";el.checked=!!row[field];el.disabled=true;el.setAttribute("aria-label",field);return el}
  const el=document.createElement("span");el.className="readonly-display";el.textContent=V.DATE_FIELDS.has(field)?V.formatDate(row[field]):(row[field]??"");return el}
function applyTheme(theme){for(const [name,value] of Object.entries(V.themeVars(theme)))document.documentElement.style.setProperty(name,value)}
function syncSelectionCheckboxes(){for(const row of state.rows){const key=M.rowKey(row),el=currentViewport&&currentViewport.querySelector(`[data-key="${key}"][data-field="Выбран"]`);if(el)el.checked=!!row["Выбран"]}}
function scheduleFrameHeight(viewport){if(viewport!==currentViewport||heightFrame!==null)return;heightFrame=requestAnimationFrame(()=>{heightFrame=null;const host=document.getElementById("grid");if(viewport!==currentViewport||!viewport.isConnected||!host.contains(viewport))return;const height=V.frameHeight(viewport);if(height!==lastFrameHeight){lastFrameHeight=height;post("streamlit:setFrameHeight",{height})}})}
function draw(){const host=document.getElementById("grid"),old=currentViewport;if(old){state.scrollTop=old.scrollTop;state.scrollLeft=old.scrollLeft}
  if(heightFrame!==null){cancelAnimationFrame(heightFrame);heightFrame=null}
  if(heightObserver){heightObserver.disconnect();heightObserver=null}
  host.textContent="";const viewport=document.createElement("div");viewport.className="viewport";const table=document.createElement("table"),head=document.createElement("thead"),hr=document.createElement("tr");
  const readOnlyFields=(args.read_only||[]);const accentField=f=>!readOnlyFields.includes(f)&&f!=="Выбран";
  for(const field of args.columns){const th=document.createElement("th");const locked=readOnlyFields.includes(field);th.textContent=locked?("🔒 "+field):field;if(locked)th.className="col-locked";else if(accentField(field))th.className="col-editable";hr.appendChild(th)}head.appendChild(hr);table.appendChild(head);const body=document.createElement("tbody");
  for(const row of state.rows){const tr=document.createElement("tr"),key=M.rowKey(row);for(const field of args.columns){const td=document.createElement("td"),readOnly=readOnlyFields.includes(field);if(readOnly)td.className="readonly";else if(accentField(field))td.className="col-editable";td.dataset.kind=V.cellKind(field,readOnly,(args.options||{})[field]);td.appendChild(readOnly?makeRenderer(row,field):makeEditor(row,field,key));tr.appendChild(td)}body.appendChild(tr)}table.appendChild(body);viewport.appendChild(table);host.appendChild(viewport);viewport.scrollTop=state.scrollTop;viewport.scrollLeft=state.scrollLeft;
  currentViewport=viewport;
  if(typeof ResizeObserver!=="undefined"){heightObserver=new ResizeObserver(()=>scheduleFrameHeight(viewport));heightObserver.observe(viewport)}
  if(state.active){const el=viewport.querySelector(`[data-key="${state.active.key}"][data-field="${CSS.escape(state.active.field)}"]`);if(el){el.focus({preventScroll:true});if(state.draftValue!==null)el.value=state.draftValue}}
  scheduleFrameHeight(viewport)}
window.addEventListener("resize",()=>scheduleFrameHeight(currentViewport));
window.addEventListener("message",event=>{if(event.data.type!=="streamlit:render")return;args=event.data.args;applyTheme(event.data.theme);const previousState=state;state=state?M.render(state,args):M.create(args.rows,args.grid_id,args.source_version,args.server_ack_revision);const nextSignature=V.displaySignature(args);if(!currentViewport||state!==previousState||nextSignature!==displaySignature){displaySignature=nextSignature;draw()}else scheduleFrameHeight(currentViewport);if(M.claimFlush(state,args.flush_token))post("streamlit:setComponentValue",{value:flushValue(args.flush_token),dataType:"json"})});
post("streamlit:componentReady",{apiVersion:1});post("streamlit:setFrameHeight",{height:0});
</script></body></html>
