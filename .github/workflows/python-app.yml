name: Python check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports
        run: |
          python - <<'PY'
          import streamlit
          import plotly
          import sqlalchemy
          print("Dependencies OK")
          PY

      - name: Run tests
        run: |
          pytest

      - name: Compile app
        run: |
          python -m py_compile app/main.py
